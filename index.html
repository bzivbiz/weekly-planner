    const INITIAL_WEEKLY_DATA = {"2026-02-16":{"1":{"urgencies":{"0":2},"completed":{}},"2":{"urgencies":{"0":1},"completed":{}},"3":{"urgencies":{"0":2},"completed":{"0":true}}},"2026-02-15":{"1771275285174":{"urgencies":{"2":1,"3":1,"4":1,"5":1,"6":1},"completed":{}},"1771275540463":{"urgencies":{"0":3,"1":2,"3":2,"4":2,"5":2},"completed":{}},"1771275568207":{"urgencies":{"0":4,"1":2,"2":2,"3":2,"4":2,"5":2,"6":4},"completed":{}},"1771275938018":{"urgencies":{"1":2,"3":2,"5":2},"completed":{}},"1771276285784":{"urgencies":{"1":2,"3":2,"5":2},"completed":{}},"1771276308110":{"urgencies":{"0":2,"1":3,"2":3,"3":3,"4":3,"5":3},"completed":{}},"1771276332182":{"urgencies":{"0":3,"1":3,"2":3,"3":3,"4":3,"5":3,"6":3},"completed":{}},"1771276352222":{"urgencies":{"1":3,"3":3,"5":3},"completed":{}},"1771276371134":{"urgencies":{"0":3,"1":3,"3":3,"4":3,"5":3},"completed":{"0":true}},"1771276381950":{"urgencies":{"0":3,"1":3,"2":3,"3":3,"4":3,"5":3,"6":3},"completed":{"0":true}},"1771276401238":{"urgencies":{"0":4,"1":4,"2":4,"3":4,"4":4,"5":4,"6":4},"completed":{"0":true}},"1771276429439":{"urgencies":{"0":4,"2":4,"3":4,"4":4},"completed":{"0":true}},"1771276451006":{"urgencies":{"4":1},"completed":{}},"1771276487253":{"urgencies":{"6":2},"completed":{}},"1771276503213":{"urgencies":{"2":1},"completed":{}},"1771276523022":{"urgencies":{"0":3,"3":2},"completed":{"0":true}},"1771276536877":{"urgencies":{"1":3,"4":3},"completed":{"1":true}},"1771276567095":{"urgencies":{"0":3,"4":3},"completed":{"0":true}},"1771277285638":{"urgencies":{"5":4},"completed":{}},"1771275642092":{"urgencies":{"0":3,"1":3,"3":3,"5":3},"completed":{"0":true}},"1771275690070":{"urgencies":{"0":1},"completed":{"0":1}}}};

    function getWeekKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth()+1).padStart(2,'0');
      const d = String(date.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }

    function getSunday(date) {
      const d = new Date(date);
      d.setDate(d.getDate() - d.getDay());
      d.setHours(0,0,0,0);
      return d;
    }

    function dayKey(i) { return `d${i}`; }

    function getUrgency(taskData, dayIndex) {
      if (!taskData?.urgencies) return undefined;
      const v = taskData.urgencies[dayKey(dayIndex)];
      if (v !== undefined) return v;
      return taskData.urgencies[dayIndex];
    }

    function getCompleted(taskData, dayIndex) {
      if (!taskData?.completed) return false;
      const v = taskData.completed[dayKey(dayIndex)];
      if (v !== undefined) return !!v;
      return !!(taskData.completed[dayIndex]);
    }

    function formatTime(minutes) {
      if (!minutes) return '0m';
      const h = Math.floor(minutes/60), m = minutes%60;
      if (!h) return `${m}m`;
      if (!m) return `${h}h`;
      return `${h}h ${m}m`;
    }

    function WeeklyPlanner() {
      const [tasks, setTasks] = useState([]);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [weeklyData, setWeeklyData] = useState({});
      const [currentWeekStart, setCurrentWeekStart] = useState(() => getSunday(new Date()));
      const [loading, setLoading] = useState(true);
      const [showTaskManager, setShowTaskManager] = useState(false);
      const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
      const [isMobile, setIsMobile] = useState(false);
      const [selectedDay, setSelectedDay] = useState(() => new Date().getDay());
      const [syncStatus, setSyncStatus] = useState('Syncing...');

      const tasksRef = useRef(tasks);
      const weeklyDataRef = useRef(weeklyData);
      const categoriesRef = useRef(categories);
      useEffect(() => { tasksRef.current = tasks; }, [tasks]);
      useEffect(() => { weeklyDataRef.current = weeklyData; }, [weeklyData]);
      useEffect(() => { categoriesRef.current = categories; }, [categories]);

      const saveData = useCallback(async () => {
        const t = tasksRef.current, w = weeklyDataRef.current, c = categoriesRef.current;
        try {
          localStorage.setItem('planner_tasks_backup', JSON.stringify(t));
          localStorage.setItem('planner_weekly_backup', JSON.stringify(w));
          localStorage.setItem('planner_categories_backup', JSON.stringify(c));
          localStorage.setItem('planner_pending_sync', 'true');
        } catch(e) {}
        if (window.isOnline) {
          try {
            setSyncStatus('Saving...');
            await database.ref('planner-tasks').set(t);
            await database.ref('planner-weekly').set(w);
            await database.ref('planner-categories').set(c);
            localStorage.removeItem('planner_pending_sync');
            setSyncStatus('Synced ✓');
          } catch(e) { setSyncStatus('Saved locally'); }
        } else { setSyncStatus('Offline - saved locally'); }
      }, []);

      useEffect(() => {
        loadData();
        const poll = setInterval(async () => {
          if (localStorage.getItem('planner_pending_sync')) return;
          try {
            const [ts, ws, cs] = await Promise.all([
              database.ref('planner-tasks').once('value'),
              database.ref('planner-weekly').once('value'),
              database.ref('planner-categories').once('value')
            ]);
            const td = ts.val(), wd = ws.val(), cd = cs.val();
            if (td && Array.isArray(td) && td.length > 0) setTasks(td);
            if (wd && typeof wd === 'object') setWeeklyData(wd);
            if (cd && Array.isArray(cd) && cd.length > 0) setCategories(cd);
            setSyncStatus('Synced ✓');
          } catch(e) { setSyncStatus('Sync error'); }
        }, 30000);
        const checkMobile = () => setIsMobile(window.innerWidth < 768);
        checkMobile();
        window.addEventListener('resize', checkMobile);
        return () => { clearInterval(poll); window.removeEventListener('resize', checkMobile); };
      }, []);

      useEffect(() => {
        const h = async () => { if (localStorage.getItem('planner_pending_sync')) { setSyncStatus('Syncing...'); await saveData(); } };
        window.addEventListener('reconnected', h);
        return () => window.removeEventListener('reconnected', h);
      }, [saveData]);

      useEffect(() => {
        if (!loading && tasks.length > 0) {
          const t = setTimeout(saveData, 1000); // short debounce: saves 1s after last change
          return () => clearTimeout(t);
        }
      }, [tasks, weeklyData, categories, loading, saveData]);

      async function loadData() {
        try {
          if (window.isOnline) {
            const [ts, ws, cs] = await Promise.all([
              database.ref('planner-tasks').once('value'),
              database.ref('planner-weekly').once('value'),
              database.ref('planner-categories').once('value')
            ]);
            const td = ts.val(), wd = ws.val(), cd = cs.val();
            if (td && Array.isArray(td)) { setTasks(td); localStorage.setItem('planner_tasks_backup', JSON.stringify(td)); }
            else { setTasks(INITIAL_TASKS); await database.ref('planner-tasks').set(INITIAL_TASKS); }
            if (wd && typeof wd === 'object') { setWeeklyData(wd); localStorage.setItem('planner_weekly_backup', JSON.stringify(wd)); }
            else { setWeeklyData(INITIAL_WEEKLY_DATA); await database.ref('planner-weekly').set(INITIAL_WEEKLY_DATA); }
            if (cd && Array.isArray(cd)) { setCategories(cd); localStorage.setItem('planner_categories_backup', JSON.stringify(cd)); }
            else { setCategories(DEFAULT_CATEGORIES); await database.ref('planner-categories').set(DEFAULT_CATEGORIES); }
            setSyncStatus('Synced ✓');
          } else {
            setSyncStatus('Offline - using local data');
            setTasks(JSON.parse(localStorage.getItem('planner_tasks_backup') || 'null') || INITIAL_TASKS);
            setWeeklyData(JSON.parse(localStorage.getItem('planner_weekly_backup') || 'null') || INITIAL_WEEKLY_DATA);
            setCategories(JSON.parse(localStorage.getItem('planner_categories_backup') || 'null') || DEFAULT_CATEGORIES);
          }
        } catch(e) {
          setSyncStatus('Error - using local backup');
          setTasks(JSON.parse(localStorage.getItem('planner_tasks_backup') || 'null') || INITIAL_TASKS);
          setWeeklyData(JSON.parse(localStorage.getItem('planner_weekly_backup') || 'null') || INITIAL_WEEKLY_DATA);
          setCategories(JSON.parse(localStorage.getItem('planner_categories_backup') || 'null') || DEFAULT_CATEGORIES);
        }
        setLoading(false);
      }

      function setUrgencyValue(taskId, dayIndex, urgency) {
        // Mark dirty immediately so poll can't overwrite before debounced save fires
        localStorage.setItem('planner_pending_sync', 'true');
        const weekKey = getWeekKey(currentWeekStart);
        setWeeklyData(prev => {
          const n = JSON.parse(JSON.stringify(prev));
          if (!n[weekKey]) n[weekKey] = {};
          if (!n[weekKey][taskId]) n[weekKey][taskId] = { urgencies: {}, completed: {} };
          if (!n[weekKey][taskId].urgencies || Array.isArray(n[weekKey][taskId].urgencies)) n[weekKey][taskId].urgencies = {};
          if (urgency === '' || urgency === null) {
            delete n[weekKey][taskId].urgencies[dayKey(dayIndex)];
          } else {
            const p = parseInt(urgency);
            if (!isNaN(p) && p >= 1 && p <= 4) n[weekKey][taskId].urgencies[dayKey(dayIndex)] = p;
          }
          return n;
        });
      }

      function toggleComplete(taskId, dayIndex) {
        // Mark dirty immediately so poll can't overwrite before debounced save fires
        localStorage.setItem('planner_pending_sync', 'true');
        const weekKey = getWeekKey(currentWeekStart);
        setWeeklyData(prev => {
          const n = JSON.parse(JSON.stringify(prev));
          if (!n[weekKey]) n[weekKey] = {};
          if (!n[weekKey][taskId]) n[weekKey][taskId] = { urgencies: {}, completed: {} };
          if (!n[weekKey][taskId].completed || Array.isArray(n[weekKey][taskId].completed)) n[weekKey][taskId].completed = {};
          n[weekKey][taskId].completed[dayKey(dayIndex)] = !getCompleted(n[weekKey][taskId], dayIndex);
          return n;
        });
      }

      function getTaskData(taskId) {
        const data = weeklyData[getWeekKey(currentWeekStart)]?.[taskId];
        if (!data) return { urgencies: {}, completed: {} };
        return {
          urgencies: (data.urgencies && !Array.isArray(data.urgencies)) ? data.urgencies : {},
          completed: (data.completed && !Array.isArray(data.completed)) ? data.completed : {}
        };
      }

      function calculateDayTotals(dayIndex) {
        const totals = { total: 0, completed: 0, byUrgency: { 1:0, 2:0, 3:0, 4:0 } };
        if (!Array.isArray(tasks)) return totals;
        tasks.forEach(task => {
          if (!task?.id) return;
          const td = getTaskData(task.id);
          const u = getUrgency(td, dayIndex);
          if (u !== undefined && u !== null) {
            totals.total += (task.minutes || 0);
            totals.byUrgency[u] = (totals.byUrgency[u] || 0) + (task.minutes || 0);
            if (getCompleted(td, dayIndex)) totals.completed += (task.minutes || 0);
          }
        });
        return totals;
      }

      function sortTasks(key, dayIndex = null) {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.dayIndex === dayIndex && sortConfig.direction === 'asc') direction = 'desc';
        setSortConfig({ key, direction, dayIndex });
      }

      function getSortedTasks() {
        if (!sortConfig.key) return tasks;
        return [...tasks].sort((a, b) => {
          let av, bv;
          if (sortConfig.key === 'day') { av = getUrgency(getTaskData(a.id), sortConfig.dayIndex) ?? 999; bv = getUrgency(getTaskData(b.id), sortConfig.dayIndex) ?? 999; }
          else if (sortConfig.key === 'name') { av = a.name.toLowerCase(); bv = b.name.toLowerCase(); }
          else if (sortConfig.key === 'category') { av = a.category; bv = b.category; }
          else if (sortConfig.key === 'importance') { av = a.importance; bv = b.importance; }
          else if (sortConfig.key === 'minutes') { av = a.minutes; bv = b.minutes; }
          if (av < bv) return sortConfig.direction === 'asc' ? -1 : 1;
          if (av > bv) return sortConfig.direction === 'asc' ? 1 : -1;
          return 0;
        });
      }

      function calculateWeekTotals() {
        const totals = { total: 0, completed: 0, byUrgency: { 1:0, 2:0, 3:0, 4:0 } };
        DAYS.forEach((_, i) => {
          const d = calculateDayTotals(i);
          totals.total += d.total; totals.completed += d.completed;
          Object.keys(d.byUrgency).forEach(u => { totals.byUrgency[u] = (totals.byUrgency[u]||0) + d.byUrgency[u]; });
        });
        return totals;
      }

      function addTask(t) { localStorage.setItem('planner_pending_sync', 'true'); setTasks(prev => [...prev, { ...t, id: Date.now() }]); }
      function updateTask(t) { localStorage.setItem('planner_pending_sync', 'true'); setTasks(prev => prev.map(x => x.id === t.id ? t : x)); }
      function deleteTask(id) {
        localStorage.setItem('planner_pending_sync', 'true');
        setTasks(prev => prev.filter(t => t.id !== id));
        setWeeklyData(prev => {
          const n = JSON.parse(JSON.stringify(prev));
          Object.keys(n).forEach(wk => { delete n[wk][id]; });
          return n;
        });
      }

      function navigateWeek(dir) {
        setCurrentWeekStart(prev => { const d = new Date(prev); d.setDate(d.getDate() + dir*7); return getSunday(d); });
      }

      function importPreviousWeek() {
        const prev = new Date(currentWeekStart); prev.setDate(prev.getDate()-7);
        const prevKey = getWeekKey(prev), curKey = getWeekKey(currentWeekStart);
        if (!weeklyData[prevKey]) { alert('No data found for previous week to import'); return; }
        localStorage.setItem('planner_pending_sync', 'true');
        setWeeklyData(prev => {
          const n = JSON.parse(JSON.stringify(prev));
          if (!n[curKey]) n[curKey] = {};
          Object.keys(prev[prevKey]).forEach(taskId => {
            const raw = prev[prevKey][taskId].urgencies || {};
            const norm = {};
            Object.keys(raw).forEach(k => { norm[/^\d+$/.test(k) ? `d${k}` : k] = raw[k]; });
            n[curKey][taskId] = { urgencies: norm, completed: {} };
          });
          return n;
        });
      }

      if (loading) return <div className="flex items-center justify-center h-screen text-white text-xl">Loading...</div>;

      const weekTotals = calculateWeekTotals();
      const sortedTasks = getSortedTasks();

      const SortIcon = ({ columnKey, dayIndex = null }) => {
        const active = sortConfig.key === columnKey && (dayIndex === null || sortConfig.dayIndex === dayIndex);
        if (!active) return <span className="text-gray-400 ml-1">↕</span>;
        return <span className="ml-1">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>;
      };

      // Mobile View
      if (isMobile) {
        const dayTotals = calculateDayTotals(selectedDay);

        // Swipe handling: track touch start/end, require >50px horizontal
        // movement that exceeds vertical movement to avoid scroll conflicts.
        const touchStart = useRef(null);
        const handleTouchStart = (e) => {
          touchStart.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        };
        const handleTouchEnd = (e) => {
          if (!touchStart.current) return;
          const dx = e.changedTouches[0].clientX - touchStart.current.x;
          const dy = e.changedTouches[0].clientY - touchStart.current.y;
          touchStart.current = null;
          // Only count as a swipe if horizontal motion dominates and exceeds threshold
          if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
          if (dx < 0) {
            // Swipe left → one day later
            setSelectedDay(prev => (prev + 1) % 7);
          } else {
            // Swipe right → one day earlier
            setSelectedDay(prev => (prev + 6) % 7);
          }
        };

        return (
          <div
            className="min-h-screen bg-gray-700 p-2"
            onTouchStart={handleTouchStart}
            onTouchEnd={handleTouchEnd}
          >
            <div className="max-w-2xl mx-auto">
              <div className="bg-gray-800 rounded-lg shadow-lg p-4 mb-2 text-white">
                <div className="flex justify-between items-center mb-3">
                  <h1 className="text-xl font-bold">Weekly Planner</h1>
                  <span className="text-xs text-gray-400">{syncStatus}</span>
                </div>
                <div className="flex justify-between items-center mb-3">
                  <button onClick={() => navigateWeek(-1)} className="px-3 py-1 bg-gray-200 text-gray-900 rounded text-sm">← Prev</button>
                  <button onClick={importPreviousWeek} className="px-2 py-1 bg-green-600 text-white text-xs rounded">Import</button>
                  <button onClick={() => navigateWeek(1)} className="px-3 py-1 bg-gray-200 text-gray-900 rounded text-sm">Next →</button>
                </div>
                <div className="mb-3">
                  <select value={selectedDay} onChange={e => setSelectedDay(parseInt(e.target.value))} className="w-full px-3 py-2 bg-gray-700 border border-gray-500 rounded text-white text-lg">
                    {DAYS.map((day, i) => { const d = new Date(currentWeekStart); d.setDate(d.getDate()+i); return <option key={i} value={i}>{day} - {d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</option>; })}
                  </select>
                </div>
                <div className="bg-gray-700 p-3 rounded-lg mb-3">
                  <div className="grid grid-cols-3 gap-2 text-center text-sm mb-2">
                    <div><div className="text-gray-300">Planned</div><div className="font-bold">{formatTime(dayTotals.total)}</div></div>
                    <div><div className="text-gray-300">Done</div><div className="font-bold text-green-400">{formatTime(dayTotals.completed)}</div></div>
                    <div><div className="text-gray-300">Left</div><div className="font-bold text-orange-400">{formatTime(dayTotals.total-dayTotals.completed)}</div></div>
                  </div>
                  <div className="w-full bg-gray-600 rounded-full h-3">
                    <div className="bg-green-500 h-3 rounded-full transition-all" style={{width:`${dayTotals.total>0?Math.round(dayTotals.completed/dayTotals.total*100):0}%`}}></div>
                  </div>
                </div>
                <button onClick={() => setShowTaskManager(!showTaskManager)} className="w-full mb-3 px-4 py-2 bg-blue-600 text-white rounded-lg">{showTaskManager ? 'Close' : 'Manage Tasks'}</button>
                {showTaskManager && <TaskManager tasks={tasks} categories={categories} onAddTask={addTask} onUpdateTask={updateTask} onDeleteTask={deleteTask} onUpdateCategories={setCategories} onClose={() => setShowTaskManager(false)} />}
                {!showTaskManager && (
                  <div className="space-y-2">
                    {sortedTasks.filter(t => getUrgency(getTaskData(t.id), selectedDay) !== undefined)
                      .sort((a,b) => (getUrgency(getTaskData(a.id), selectedDay)??999)-(getUrgency(getTaskData(b.id), selectedDay)??999))
                      .map(task => {
                        const td = getTaskData(task.id);
                        const u = getUrgency(td, selectedDay);
                        const done = getCompleted(td, selectedDay);
                        const color = categories.find(c => c.name === task.category)?.color || '';
                        return (
                          <div key={task.id} className={`${color} p-3 rounded-lg border-2`}>
                            <div className="flex items-start gap-2 flex-1">
                              <input type="checkbox" checked={done} onChange={() => toggleComplete(task.id, selectedDay)} className="w-5 h-5 mt-1" />
                              <div className="flex-1">
                                <div className={`font-semibold ${done ? 'line-through opacity-60' : ''}`}>{task.name}</div>
                                <div className="text-xs mt-1 opacity-80">{task.category} • {task.importance} • {task.minutes}m • U{u}</div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    {sortedTasks.filter(t => getUrgency(getTaskData(t.id), selectedDay) !== undefined).length === 0 && (
                      <div className="text-center text-gray-400 py-8">No tasks assigned for this day</div>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // Desktop View
      return (
        <div className="min-h-screen bg-gray-700 p-4">
          <div className="max-w-7xl mx-auto">
            <div className="bg-gray-800 rounded-lg shadow-lg p-6 mb-4 text-white">

              {/* ── Header row ── */}
              <div className="flex justify-between items-center mb-3">
                <h1 className="text-3xl font-bold text-white">Weekly Task Planner</h1>
                <div className="flex items-center gap-4">
                  <span className="text-sm text-gray-400">{syncStatus}</span>
                  <button onClick={() => setShowTaskManager(!showTaskManager)} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    ⚙️ Manage Tasks
                  </button>
                </div>
              </div>

              {/* ── Week navigation bar ── */}
              <div className="mb-2 flex items-center justify-between px-1">
                <button onClick={() => navigateWeek(-1)} className="px-3 py-1 bg-gray-200 text-gray-900 rounded hover:bg-gray-300 text-xs font-medium">← Prev</button>
                <div className="flex items-center gap-3">
                  <span className="text-white font-semibold text-sm">Week of {currentWeekStart.toLocaleDateString()}</span>
                  <button onClick={importPreviousWeek} className="px-2 py-1 bg-green-600 text-white text-xs rounded hover:bg-green-700">📥 Import Prev</button>
                </div>
                <button onClick={() => navigateWeek(1)} className="px-3 py-1 bg-gray-200 text-gray-900 rounded hover:bg-gray-300 text-xs font-medium">Next →</button>
              </div>

              {showTaskManager && (
                <TaskManager tasks={tasks} categories={categories} onAddTask={addTask} onUpdateTask={updateTask} onDeleteTask={deleteTask} onUpdateCategories={setCategories} onClose={() => setShowTaskManager(false)} />
              )}

              <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                <table className="w-full border-collapse">
                  <thead>
                    {/* ── Summary row 1: Planned & Done ── */}
                    <tr>
                      <th colSpan={4} className="border border-gray-600 px-2 py-1 bg-gray-700 sticky-corner text-left text-xs text-gray-400 font-normal">
                        <div className="flex gap-3"><span>Planned</span><span className="text-green-400">Done</span></div>
                      </th>
                      {DAYS.map((day, i) => {
                        const totals = calculateDayTotals(i);
                        return (
                          <th key={day} className="border border-gray-600 px-1 py-1 bg-gray-700 sticky-header text-center font-normal">
                            <div className="text-xs text-white">{formatTime(totals.total)}</div>
                            <div className="text-xs text-green-400">{formatTime(totals.completed)}</div>
                          </th>
                        );
                      })}
                    </tr>
                    {/* ── Summary row 2: Progress bars ── */}
                    <tr>
                      <th colSpan={4} className="border border-gray-600 px-2 py-1 bg-gray-700 sticky-corner text-left text-xs text-gray-400 font-normal">%&nbsp;done</th>
                      {DAYS.map((day, i) => {
                        const totals = calculateDayTotals(i);
                        const pct = totals.total > 0 ? Math.round(totals.completed/totals.total*100) : 0;
                        return (
                          <th key={day} className="border border-gray-600 px-1 py-1 bg-gray-700 sticky-header font-normal">
                            <div className="flex items-center gap-1">
                              <div className="flex-1 bg-gray-600 rounded-full h-1.5">
                                <div className="bg-green-500 h-1.5 rounded-full transition-all" style={{width:`${pct}%`}}></div>
                              </div>
                              <span className="text-xs text-gray-400 w-6 text-right shrink-0">{pct}%</span>
                            </div>
                          </th>
                        );
                      })}
                    </tr>
                    {/* ── Column header row ── */}
                    <tr>
                      <th className="border border-gray-600 p-2 bg-gray-700 sticky-corner cursor-pointer hover:bg-gray-600" onClick={() => sortTasks('name')}>Task <SortIcon columnKey="name" /></th>
                      <th className="border border-gray-600 p-2 bg-gray-700 sticky-header cursor-pointer hover:bg-gray-600" onClick={() => sortTasks('category')}>Cat <SortIcon columnKey="category" /></th>
                      <th className="border border-gray-600 p-2 bg-gray-700 sticky-header cursor-pointer hover:bg-gray-600" onClick={() => sortTasks('importance')}>Imp <SortIcon columnKey="importance" /></th>
                      <th className="border border-gray-600 p-2 bg-gray-700 sticky-header cursor-pointer hover:bg-gray-600" onClick={() => sortTasks('minutes')}>Min <SortIcon columnKey="minutes" /></th>
                      {DAYS.map((day, i) => (
                        <th key={day} className="border border-gray-600 p-2 bg-gray-700 sticky-header cursor-pointer hover:bg-gray-600" onClick={() => sortTasks('day', i)}>{day} <SortIcon columnKey="day" dayIndex={i} /></th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {sortedTasks.map(task => {
                      const td = getTaskData(task.id);
                      const color = categories.find(c => c.name === task.category)?.color || '';
                      return (
                        <tr key={task.id} className={`${color} border-2 text-sm`}>
                          <td className="border border-gray-600 p-1 font-medium sticky-col bg-inherit">{task.name}</td>
                          <td className="border border-gray-600 p-1 text-center text-xs">{task.category}</td>
                          <td className="border border-gray-600 p-1 text-center font-bold">{task.importance}</td>
                          <td className="border border-gray-600 p-1 text-center">{task.minutes}</td>
                          {DAYS.map((_, i) => (
                            <td key={i} className="border border-gray-600 p-1">
                              <div className="flex items-center gap-1">
                                <input
                                  type="text"
                                  key={`${task.id}-${i}-${getUrgency(td,i)??''}`}
                                  defaultValue={getUrgency(td,i)??''}
                                  onBlur={e => setUrgencyValue(task.id, i, e.target.value)}
                                  onKeyDown={e => {
                                    const nD = DAYS.length, tIdx = sortedTasks.indexOf(task), nT = sortedTasks.length;
                                    let nTI = tIdx, nDI = i;
                                    if (e.key==='ArrowUp') nTI=(tIdx-1+nT)%nT;
                                    else if (e.key==='ArrowDown') nTI=(tIdx+1)%nT;
                                    else if (e.key==='ArrowLeft') nDI=(i-1+nD)%nD;
                                    else if (e.key==='ArrowRight') nDI=(i+1)%nD;
                                    else if (e.key==='Enter') { setUrgencyValue(task.id, i, e.target.value); nTI=(tIdx+1)%nT; }
                                    else return;
                                    e.preventDefault();
                                    setUrgencyValue(task.id, i, e.target.value);
                                    const next = document.querySelector(`input[data-cell="${sortedTasks[nTI].id}-${nDI}"]`);
                                    if (next) next.focus();
                                  }}
                                  data-cell={`${task.id}-${i}`}
                                  className="w-7 text-center border rounded text-sm"
                                  maxLength="1"
                                  placeholder="-"
                                />
                                <input type="checkbox" checked={getCompleted(td,i)} onChange={() => toggleComplete(task.id,i)} className="w-4 h-4" disabled={getUrgency(td,i)===undefined} />
                              </div>
                            </td>
                          ))}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              <div className="mt-4 grid grid-cols-8 gap-4">
                {DAYS.map((day, i) => {
                  const totals = calculateDayTotals(i);
                  const date = new Date(currentWeekStart); date.setDate(date.getDate()+i);
                  const dateLabel = date.toLocaleDateString('en-US', { month:'short', day:'numeric' });
                  return (
                    <div key={day} className="bg-gray-700 p-3 rounded-lg text-white">
                      <h3 className="font-bold text-center mb-1 text-sm">{day}</h3>
                      <p className="text-center text-xs text-gray-400 mb-2">{dateLabel}</p>
                      <p className="text-center text-lg font-bold">{formatTime(totals.total)}</p>
                      <p className="text-center text-sm text-green-400">✓ {formatTime(totals.completed)}</p>
                      <div className="text-xs mt-2 space-y-1">
                        {[1,2,3,4].map(u => totals.byUrgency[u]>0 && <p key={u}>U{u}: {formatTime(totals.byUrgency[u])}</p>)}
                      </div>
                    </div>
                  );
                })}
                <div className="bg-blue-700 p-3 rounded-lg text-white">
                  <h3 className="font-bold text-center mb-2">Week</h3>
                  <p className="text-center text-lg font-bold">{formatTime(weekTotals.total)}</p>
                  <p className="text-center text-sm text-green-400">✓ {formatTime(weekTotals.completed)}</p>
                  <div className="text-xs mt-2 space-y-1">
                    {[1,2,3,4].map(u => weekTotals.byUrgency[u]>0 && <p key={u}>U{u}: {formatTime(weekTotals.byUrgency[u])}</p>)}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TaskManager({ tasks, categories, onAddTask, onUpdateTask, onDeleteTask, onUpdateCategories, onClose }) {
      const [newTask, setNewTask] = useState({ name:'', category:categories[0]?.name||'Work', importance:'B', minutes:30 });
      const [showCategoryEditor, setShowCategoryEditor] = useState(false);
      const [editingCategories, setEditingCategories] = useState([...categories]);
      const [sortBy, setSortBy] = useState('name');
      const [sortDir, setSortDir] = useState('asc');
      const [editingTaskId, setEditingTaskId] = useState(null);
      const [editingTask, setEditingTask] = useState(null);

      function handleSubmit(e) {
        e.preventDefault();
        if (newTask.name.trim()) { onAddTask(newTask); setNewTask({ name:'', category:categories[0]?.name||'Work', importance:'B', minutes:30 }); }
      }
      function updateCategoryName(i, n) { const u=[...editingCategories]; u[i]={...u[i],name:n}; setEditingCategories(u); }
      function saveCategoryChanges() { onUpdateCategories(editingCategories); setShowCategoryEditor(false); }
      function cancelCategoryChanges() { setEditingCategories([...categories]); setShowCategoryEditor(false); }
      function handleSort(col) { if (sortBy===col) setSortDir(sortDir==='asc'?'desc':'asc'); else { setSortBy(col); setSortDir('asc'); } }
      function getSortedTasks() {
        return [...tasks].sort((a,b) => {
          let av,bv;
          if (sortBy==='name') { av=a.name.toLowerCase(); bv=b.name.toLowerCase(); }
          else if (sortBy==='category') { av=a.category; bv=b.category; }
          else if (sortBy==='importance') { av=a.importance; bv=b.importance; }
          else if (sortBy==='minutes') { av=a.minutes; bv=b.minutes; }
          if (av<bv) return sortDir==='asc'?-1:1;
          if (av>bv) return sortDir==='asc'?1:-1;
          return 0;
        });
      }
      function startEditing(t) { setEditingTaskId(t.id); setEditingTask({...t}); }
      function cancelEditing() { setEditingTaskId(null); setEditingTask(null); }
      function saveEdit() { if (editingTask?.name.trim()) onUpdateTask(editingTask); setEditingTaskId(null); setEditingTask(null); }
      const SI = ({col}) => sortBy!==col ? <span className="text-gray-400 ml-1">↕</span> : <span className="ml-1">{sortDir==='asc'?'↑':'↓'}</span>;
      const sorted = getSortedTasks();

      return (
        <div className="mb-6 p-4 bg-gray-700 rounded-lg border-2 border-blue-400 text-white">
          <div className="flex justify-between items-center mb-4">
            <h3 className="text-xl font-bold">Task Manager</h3>
            <div className="flex gap-2">
              <button onClick={() => setShowCategoryEditor(!showCategoryEditor)} className="px-3 py-1 bg-indigo-600 text-white rounded hover:bg-indigo-700 text-sm">✏️ Edit Categories</button>
              <button onClick={onClose} className="text-gray-300 hover:text-white text-2xl">✕</button>
            </div>
          </div>
          {showCategoryEditor && (
            <div className="mb-4 p-3 bg-gray-800 rounded-lg border-2 border-indigo-400">
              <h4 className="font-bold mb-2 text-white">Edit Category Names</h4>
              <div className="grid grid-cols-2 gap-2 mb-3">
                {editingCategories.map((cat,i) => (
                  <div key={i} className={`flex items-center gap-2 p-2 rounded ${cat.color}`}>
                    <input type="text" value={cat.name} onChange={e => updateCategoryName(i,e.target.value)} className="flex-1 px-2 py-1 border rounded text-sm text-gray-900" />
                  </div>
                ))}
              </div>
              <div className="flex gap-2 justify-end">
                <button onClick={cancelCategoryChanges} className="px-3 py-1 bg-gray-300 text-gray-900 rounded hover:bg-gray-400">Cancel</button>
                <button onClick={saveCategoryChanges} className="px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700">Save Changes</button>
              </div>
            </div>
          )}
          <form onSubmit={handleSubmit} className="mb-4 grid grid-cols-5 gap-2">
            <input type="text" placeholder="Task name" value={newTask.name} onChange={e => setNewTask({...newTask,name:e.target.value})} className="col-span-2 px-3 py-2 border rounded text-gray-900" />
            <select value={newTask.category} onChange={e => setNewTask({...newTask,category:e.target.value})} className="px-3 py-2 border rounded text-gray-900">
              {categories.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
            </select>
            <select value={newTask.importance} onChange={e => setNewTask({...newTask,importance:e.target.value})} className="px-3 py-2 border rounded text-gray-900">
              {IMPORTANCE_LEVELS.map(i => <option key={i} value={i}>{i}</option>)}
            </select>
            <div className="flex gap-2">
              <input type="number" placeholder="Minutes" value={newTask.minutes} onChange={e => setNewTask({...newTask,minutes:parseInt(e.target.value)||0})} className="w-20 px-3 py-2 border rounded text-gray-900" />
              <button type="submit" className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">➕</button>
            </div>
          </form>
          <div className="max-h-96 overflow-y-auto">
            <table className="w-full text-sm">
              <thead className="sticky top-0 bg-gray-600 z-10">
                <tr>
                  <th className="p-2 text-left cursor-pointer hover:bg-gray-500" onClick={() => handleSort('name')}>Task <SI col="name" /></th>
                  <th className="p-2 cursor-pointer hover:bg-gray-500" onClick={() => handleSort('category')}>Category <SI col="category" /></th>
                  <th className="p-2 cursor-pointer hover:bg-gray-500" onClick={() => handleSort('importance')}>Importance <SI col="importance" /></th>
                  <th className="p-2 cursor-pointer hover:bg-gray-500" onClick={() => handleSort('minutes')}>Minutes <SI col="minutes" /></th>
                  <th className="p-2">Actions</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map(task => (
                  <tr key={task.id} className="border-b border-gray-600">
                    {editingTaskId===task.id ? (
                      <>
                        <td className="p-2"><input type="text" value={editingTask.name} onChange={e => setEditingTask({...editingTask,name:e.target.value})} className="w-full px-2 py-1 border rounded text-gray-900 text-sm" /></td>
                        <td className="p-2"><select value={editingTask.category} onChange={e => setEditingTask({...editingTask,category:e.target.value})} className="w-full px-2 py-1 border rounded text-gray-900 text-sm">{categories.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}</select></td>
                        <td className="p-2"><select value={editingTask.importance} onChange={e => setEditingTask({...editingTask,importance:e.target.value})} className="w-full px-2 py-1 border rounded text-gray-900 text-sm">{IMPORTANCE_LEVELS.map(i => <option key={i} value={i}>{i}</option>)}</select></td>
                        <td className="p-2"><input type="number" value={editingTask.minutes} onChange={e => setEditingTask({...editingTask,minutes:parseInt(e.target.value)||0})} className="w-full px-2 py-1 border rounded text-gray-900 text-sm" /></td>
                        <td className="p-2"><div className="flex gap-1"><button onClick={saveEdit} className="text-green-400 hover:text-green-300 text-xs">Save</button><button onClick={cancelEditing} className="text-red-400 hover:text-red-300 text-xs">Cancel</button></div></td>
                      </>
                    ) : (
                      <>
                        <td className="p-2">{task.name}</td>
                        <td className="p-2 text-center">{task.category}</td>
                        <td className="p-2 text-center">{task.importance}</td>
                        <td className="p-2 text-center">{task.minutes}</td>
                        <td className="p-2 text-center"><div className="flex gap-1 justify-center"><button onClick={() => startEditing(task)} className="text-blue-400 hover:text-blue-300 text-xs">Edit</button><button onClick={() => onDeleteTask(task.id)} className="text-red-400 hover:text-red-300 text-xs">Delete</button></div></td>
                      </>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WeeklyPlanner />);
  </script>
</body>
</html>
